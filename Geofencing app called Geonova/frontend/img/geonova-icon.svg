<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Golden Amber Gradient -->
    <linearGradient id="gnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    
    <!-- Electric Tech Cyan Gradient -->
    <linearGradient id="gnCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Metallic Shield Inner Fill Gradient -->
    <linearGradient id="gnShieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Outer Geofence Precision Orbit Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#gnGoldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="64 6 12 6" fill="none" opacity="0.9" />
  <circle cx="50" cy="50" r="47.5" stroke="url(#gnCyanGrad)" stroke-width="1" stroke-dasharray="2 6" fill="none" opacity="0.5" />

  <!-- Radar Cardinal Compass Tick Marks -->
  <line x1="50" y1="2" x2="50" y2="7" stroke="url(#gnGoldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="93" x2="50" y2="98" stroke="url(#gnGoldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="2" y1="50" x2="7" y2="50" stroke="url(#gnGoldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="93" y1="50" x2="98" y2="50" stroke="url(#gnGoldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Geofence Security Shield Crest -->
  <path d="M 50 14 C 67 14 77 22 77 39 C 77 60 56 77 50 85 C 44 77 23 60 23 39 C 23 22 33 14 50 14 Z" fill="url(#gnShieldFill)" stroke="url(#gnGoldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Cyan Tech Shield Accent Line -->
  <path d="M 50 20 C 63 20 71 26 71 40 C 71 57 53 71 50 78 C 47 71 29 57 29 40 C 29 26 37 20 50 20 Z" fill="none" stroke="url(#gnCyanGrad)" stroke-width="1.2" opacity="0.7" />

  <!-- Central Location Pin & Cultural Arch Icon -->
  <!-- GPS Pin Outer Shell -->
  <path d="M 50 27 C 42.5 27 36.5 33 36.5 40.5 C 36.5 51 50 66 50 66 C 50 66 63.5 51 63.5 40.5 C 63.5 33 57.5 27 50 27 Z" fill="url(#gnGoldGrad)" />

  <!-- Heritage Monument Arch Cutout inside Pin -->
  <path d="M 44.5 52 V 43 C 44.5 39.5 47 37 50 37 C 53 37 55.5 39.5 55.5 43 V 52 H 44.5 Z" fill="#0F172A" />

  <!-- Central Monument Dome Peak inside Arch -->
  <path d="M 47.5 43 C 47.5 40.5 50 39 50 39 C 50 39 52.5 40.5 52.5 43 Z" fill="url(#gnGoldGrad)" />

  <!-- Sparkling Nova Guidance Star at Top of Pin -->
  <path d="M 50 29.5 L 51.5 33 L 55 34.5 L 51.5 36 L 50 39.5 L 48.5 36 L 45 34.5 L 48.5 33 Z" fill="#FFFFFF" />
  <circle cx="50" cy="34.5" r="1" fill="url(#gnGoldGrad)" />
</svg>
